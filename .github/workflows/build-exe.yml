name: Build BlipAI-Etiquetas.exe

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build executable with PyInstaller
        run: |
          pyinstaller --clean --noconfirm --onefile --windowed `
            --name "BlipAI-Etiquetas" `
            --hidden-import win32print `
            --hidden-import win32con `
            --hidden-import win32api `
            --hidden-import win32gui `
            --hidden-import win32ui `
            --hidden-import PIL.Image `
            --hidden-import PIL.ImageTk `
            --hidden-import customtkinter `
            --hidden-import darkdetect `
            --hidden-import openpyxl `
            --hidden-import openpyxl.styles.numbers `
            --hidden-import reportlab `
            --hidden-import reportlab.pdfgen.canvas `
            --hidden-import painel_ui `
            --hidden-import imagens_api `
            --hidden-import relatorios `
            --hidden-import relatorio_export `
            painel_automata.py

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlipAI-Etiquetas-exe
          path: dist/BlipAI-Etiquetas.exe

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "BlipAI-Etiquetas (Executável Windows)"
          body: "Compilação automatizada do executável BlipAI-Etiquetas.exe para Windows."
          draft: false
          prerelease: false
          files: dist/BlipAI-Etiquetas.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

